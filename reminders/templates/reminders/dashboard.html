<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Vaccine & Medication Reminders</title>
    <!-- Simple styling via Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>Welcome, {{ request.user.username }}</h2>
    <h3 class="mt-4">Your Active Reminders</h3>
    
    <ul class="list-group mt-3">
        {% for reminder in reminders %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <strong>{{ reminder.title }}</strong>
                <span class="badge bg-primary rounded-pill">{{ reminder.reminder_time }}</span>
            </li>
        {% empty %}
            <li class="list-group-item">No reminders set yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
